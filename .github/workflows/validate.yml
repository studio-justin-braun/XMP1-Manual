name: Validierung

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Abhängigkeiten installieren
        run: python -m pip install -r requirements.txt
      - name: Repository und fertige Ausgabe prüfen
        run: python scripts/check_repository.py
      - name: JavaScript-Syntax prüfen
        run: node --check scripts/manual.js
      - name: PDF vollständig prüfen und rendern
        run: python scripts/verify_manual.py
      - name: HTML aus archivierten Quellen bauen
        run: python scripts/build_manual.py --html-only
      - name: Ausgeliefertes HTML mit Neubau vergleichen
        run: python -c "from pathlib import Path; assert Path('build/Handbuch/index.html').read_text(encoding='utf-8') == Path('Handbuch/index.html').read_text(encoding='utf-8'), 'HTML und Generator sind nicht synchron'"
      - name: Downloadpaket prüfen
        run: python scripts/package_manual.py
